<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-slate-100">

    <div class="bg-white max-w-md mx-auto rounded-lg ">
        <div class="bg-indigo-500 p-5 text-white">
            <h1>Todo App</h1>
        </div>
        <div class="p-5">
            <form id="todo-form" action="" class="flex gap-5">
                <input id="todo-input" placeholder="Enter Task Description..." class="border border-black flex-1 p-2" type="text">
                <button id="form-btn" class="px-5 py-3  bg-violet-600 text-white cursor-pointer">Add</button>
                <button id="cancel-edit-btn" class="text  text-red-500 cursor-pointer hidden hover:text-red-400"><u>Cancel Editing</u></button>
            </form>

            <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black">
                <p id="task-count">Task (0)</p>
                <p id="completed-count">Completed : 0</p>
            </div>

            <ul class="py-5 flex flex-col gap-3" id="todo-list">  

                  <!-- <li data-id="1" class="flex gap-2 border rounded-xl border-slate-300 p-4">
                    <input type="checkbox">
                    <p class="flex-1">hello</p>
                    <div class="flex gap-2">
                        <button>Edit</button>
                        <button>Delete</button>
                    </div>
                </li>  -->

            </ul>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
